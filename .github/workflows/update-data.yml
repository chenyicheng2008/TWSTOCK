name: update-data

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 台灣時間 週一~週五 18:30（GitHub 排程尖峰時可能延遲數十分鐘）
  workflow_dispatch:           # 可在 Actions 頁面手動觸發
  push:                        # 程式或 workflow 有修改時自動驗證一次
    branches: [main]           # （機器人用 GITHUB_TOKEN 提交的資料 commit 不會觸發）
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write              # commit 資料 + 發布 Release

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # 診斷結果寫成 annotation：公開 repo 的 annotation 不用登入即可讀取（log 需要登入）
      # 金鑰只記錄「是否設定 + 長度」，不輸出內容
      - name: Diagnose
        run: |
          if [ -n "$FUGLE_API_KEY" ]; then f="已設定(${#FUGLE_API_KEY}字)"; else f="未設定"; fi
          if [ -n "$FINLAB_TOKEN" ]; then l="已設定(${#FINLAB_TOKEN}字)"; else l="未設定"; fi
          # 附上 curl 錯誤碼：35=TLS 錯誤、56=連線被重置、28=逾時、6/7=解析或連線失敗
          code() { local o rc; o=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "$@"); rc=$?
                   if [ "$rc" -ne 0 ]; then echo "${o}(curl錯誤$rc)"; else echo "$o"; fi; }
          frm=$(date -d '10 days ago' +%F); to=$(date +%F)
          tw=$(code https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL)
          tp=$(code --compressed https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes)
          fg=$(code -H "X-API-KEY: $FUGLE_API_KEY" "https://api.fugle.tw/marketdata/v1.0/stock/historical/candles/2330?timeframe=D&from=$frm&to=$to")
          yf=$(code -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?range=5d&interval=1d")
          echo "::notice title=Diagnose::FUGLE_API_KEY=$f FINLAB_TOKEN=$l | HTTP TWSE=$tw TPEx=$tp Fugle=$fg Yahoo=$yf"

      - name: Rebuild data
        run: |
          set +e
          python tw_rebuild_hybrid.py 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -v -e 'possibly delisted' -e 'Length mismatch' run.log | tail -n 25 \
                  | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=Rebuild data failed (exit $rc)::${msg}"
          fi
          exit $rc

      - name: Commit per-symbol data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add daily weekly tw_weekly_indicators.csv tw_monthly_indicators.csv tw_market_category.csv
          if git diff --cached --quiet; then
            echo "資料無變動，略過 commit"
          else
            git commit -m "data: $(date '+%F %H:%M') 自動更新"
            git push
          fi

      - name: Publish merged CSVs to release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gzip -kf tw_all_weekly.csv tw_all_daily_1yr.csv
          files="tw_all_weekly.csv.gz tw_all_daily_1yr.csv.gz tw_weekly_indicators.csv tw_monthly_indicators.csv"
          ls -l $files >>pub.log 2>&1
          notes="更新於 $(date '+%F %H:%M')（台灣時間）"
          ok=0
          for i in 1 2 3; do
            if gh release view latest >/dev/null 2>&1; then
              # 已存在：覆蓋附件後更新說明
              gh release upload latest $files --clobber >>pub.log 2>&1 &&                 gh release edit latest --notes "$notes" >>pub.log 2>&1 && ok=1
            else
              # 不存在：建立與上傳用同一個指令，避免「剛建立就上傳」的時間差
              gh release create latest $files --title "Latest data" --notes "$notes" >>pub.log 2>&1 && ok=1
            fi
            [ "$ok" = 1 ] && break
            echo "第 $i 次失敗，15 秒後重試" >>pub.log
            sleep 15
          done
          cat pub.log
          if [ "$ok" != 1 ]; then
            msg=$(tail -n 25 pub.log | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=Publish release failed::${msg}"
            exit 1
          fi
